# Render Blueprint for the Healthcare Claims Analytics Warehouse backend.
# Synthetic data only -- see README.md.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
# -> select this repo. Render reads this file and provisions the service
# below automatically.
#
# Database: this project reuses an existing Postgres instance already on
# the account (rather than provisioning a second free-tier database,
# which Render's free plan caps at one per account) -- our tables live in
# dedicated schemas (raw/staging/warehouse/marts/audit/compliance), so
# they don't collide with whatever else lives in that database's public
# schema. DATABASE_URL is set manually (sync: false) rather than
# committed here.

services:
  - type: web
    name: healthcare-claims-warehouse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/about/project/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: healthcare-claims-warehouse-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://healthcare-claims-warehouse-fronten.vercel.app
