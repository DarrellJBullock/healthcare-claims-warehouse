# Render Blueprint for the Healthcare Claims Analytics Warehouse backend.
# Synthetic data only -- see README.md.
#
# Deploy: https://dashboard.render.com/blueprints -> New Blueprint Instance
# -> select this repo. Render reads this file and provisions both
# resources below automatically.

databases:
  - name: healthcare-claims-warehouse-db
    plan: free
    databaseName: healthcare_claims_warehouse
    user: healthcare_claims_warehouse

services:
  - type: web
    name: healthcare-claims-warehouse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/about/project/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-claims-warehouse-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: healthcare-claims-warehouse-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://healthcare-claims-warehouse-fronten.vercel.app
