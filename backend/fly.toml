# Fly.io app configuration for the Healthcare Claims Analytics Warehouse
# backend (Django + DRF). Synthetic data only -- see README.md.

app = "healthcare-claims-warehouse-api"
primary_region = "iad"

[build]

[env]
  DJANGO_DEBUG = "False"
  DJANGO_ALLOWED_HOSTS = "healthcare-claims-warehouse-api.fly.dev"
  CORS_ALLOWED_ORIGINS = "https://healthcare-claims-warehouse-fronten.vercel.app"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/about/project/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
