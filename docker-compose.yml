services:
  db:
    image: postgres:16-alpine
    container_name: healthcare_claims_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: healthcare_claims_warehouse
    ports:
      - "5432:5432"
    volumes:
      - healthcare_claims_warehouse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  healthcare_claims_warehouse_pgdata:
